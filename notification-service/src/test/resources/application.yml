spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    bus:
      enabled: false
  config:
    import: "optional:configserver:"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/piggymetrics-notif-test
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  security:
    oauth2:
      client:
        registration:
          notification-service:
            client-id: notification-service
            client-secret: password
            authorization-grant-type: client_credentials
            scope: server
        provider:
          notification-service:
            token-uri: http://localhost:9999/uaa/oauth2/token
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/uaa/oauth2/jwks

eureka:
  client:
    enabled: false

remind:
  cron: 0 0 0 * * *
  email:
    text: "Hey, {0}!"
    subject: reminder

backup:
  cron: 0 0 12 * * *
  email:
    text: "Howdy, {0}."
    subject: backup
    attachment: backup.json
