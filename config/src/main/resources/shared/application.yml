logging:
  level:
    org.springframework.security: INFO

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://registry:8761/eureka/

spring:
  rabbitmq:
    host: rabbitmq
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:5000/uaa
