spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          account-service:
            client-id: account-service
            client-secret: ${ACCOUNT_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server
            provider: auth-service
        provider:
          auth-service:
            token-uri: http://auth-service:5000/uaa/oauth2/token
      resourceserver:
        opaque-token:
          introspection-uri: http://auth-service:5000/uaa/users/current
  data:
    mongodb:
      host: account-mongodb
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017

server:
  servlet:
    context-path: /accounts
  port: 6000
