server:
  port: 4000
spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://auth-service:5000
            predicates: [Path=/uaa/**]
          - id: account-service
            uri: lb://account-service
            predicates: [Path=/accounts/**]
          - id: statistics-service
            uri: lb://statistics-service
            predicates: [Path=/statistics/**]
          - id: notification-service
            uri: lb://notification-service
            predicates: [Path=/notifications/**]
        http-client:
          connect-timeout: 20000
          read-timeout: 20s
    openfeign:
      client:
        config:
          default:
            connectTimeout: 20000
            readTimeout: 20000
