  existing_implementation: No SettlementObservability in account-service tree
  creates_file: true
  change: Create SettlementObservability registering Micrometer Timer account.settlement.latency with
    publishPercentiles(0.95) and Counter account.settlement.failed.batch, plus SettlementDashboard DTO
    used by the dashboard endpoint.
  do_not:
  - Put metrics only in monitoring module
  - Use Dropwizard MetricsRegistry instead of Micrometer
  companion_required: true
  exact_companion: "package com.piggymetrics.account.domain;\n\npublic class SettlementDashboard {\n\n\
    \tprivate double settlementLatencyP95Ms;\n\n\tprivate long failedBatchCount;\n\n\tpublic double getSettlementLatencyP95Ms()\
    \ {\n\t\treturn settlementLatencyP95Ms;\n\t}\n\n\tpublic void setSettlementLatencyP95Ms(double settlementLatencyP95Ms)\
    \ {\n\t\tthis.settlementLatencyP95Ms = settlementLatencyP95Ms;\n\t}\n\n\tpublic long getFailedBatchCount()\
    \ {\n\t\treturn failedBatchCount;\n\t}\n\n\tpublic void setFailedBatchCount(long failedBatchCount)\
    \ {\n\t\tthis.failedBatchCount = failedBatchCount;\n\t}\n}\n"
  exact_snippet: "package com.piggymetrics.account.service;\n\nimport com.piggymetrics.account.domain.SettlementDashboard;\n\
    import io.micrometer.core.instrument.Counter;\nimport io.micrometer.core.instrument.MeterRegistry;\n\
    import io.micrometer.core.instrument.Timer;\nimport io.micrometer.core.instrument.distribution.HistogramSnapshot;\n\
    import io.micrometer.core.instrument.distribution.ValueAtPercentile;\nimport org.springframework.stereotype.Component;\n\
    \nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicBoolean;\n\n@Component\n\
    public class SettlementObservability {\n\n\tpublic static final String TIMER_NAME = \"account.settlement.latency\"\
    ;\n\tpublic static final String COUNTER_NAME = \"account.settlement.failed.batch\";\n\n\tprivate final\
    \ Timer settlementLatency;\n\tprivate final Counter failedBatchCounter;\n\tprivate final AtomicBoolean\
    \ lastAttemptFailed = new AtomicBoolean(false);\n\n\tpublic SettlementObservability(MeterRegistry\
    \ registry) {\n\t\tthis.settlementLatency = Timer.builder(TIMER_NAME)\n\t\t\t\t.publishPercentiles(0.95)\n\
    \t\t\t\t.publishPercentileHistogram()\n\t\t\t\t.register(registry);\n\t\tthis.failedBatchCounter =\
    \ Counter.builder(COUNTER_NAME).register(registry);\n\t}\n\n\tpublic void markAttemptFailed() {\n\t\
    \tlastAttemptFailed.set(true);\n\t\tfailedBatchCounter.increment();\n\t}\n\n\tpublic boolean consumeFailedFlag()\
    \ {\n\t\treturn lastAttemptFailed.getAndSet(false);\n\t}\n\n\tpublic void recordLatencyNanos(long\
    \ nanos) {\n\t\tsettlementLatency.record(nanos, TimeUnit.NANOSECONDS);\n\t}\n\n\tpublic SettlementDashboard\
    \ snapshot() {\n\t\tSettlementDashboard dashboard = new SettlementDashboard();\n\t\tdashboard.setSettlementLatencyP95Ms(readP95Millis());\n\
    \t\tdashboard.setFailedBatchCount((long) failedBatchCounter.count());\n\t\treturn dashboard;\n\t}\n\
    \n\tprivate double readP95Millis() {\n\t\tHistogramSnapshot snap = settlementLatency.takeSnapshot();\n\
    \t\tfor (ValueAtPercentile vap : snap.percentileValues()) {\n\t\t\tif (Math.abs(vap.percentile() -\
    \ 0.95) < 0.001) {\n\t\t\t\treturn vap.value(TimeUnit.MILLISECONDS);\n\t\t\t}\n\t\t}\n\t\treturn settlementLatency.mean(TimeUnit.MILLISECONDS);\n\
    \t}\n}\n"
  compatibility: Component scanned from AccountApplication package root
  error_handling: markAttemptFailed increments counter and sets thread-local failed flag
  tests:
  - AccountServiceApplicationTests.settlementDashboardBeanWired
  acceptance:
  - SettlementObservability.snapshot returns settlementLatencyP95Ms and failedBatchCount
  - Timer name is account.settlement.latency with 0.95 percentile
  rollback: Delete both new Java files
  why: Goal items 1 and 2 need a shared in-process metric holder for latency and failed batches
  expected_result: Coding agent can record latency and read a dashboard snapshot without inventing APIs
  invariants:
  - TIMER_NAME account.settlement.latency
  - COUNTER_NAME account.settlement.failed.batch
  edge_cases:
  - consumeFailedFlag clears the flag so retries can re-arm via fallback
  machine_verify:
  - test -f account-service/src/main/java/com/piggymetrics/account/service/SettlementObservability.java
  human_verify:
  - snapshot maps p95 timer + counter into SettlementDashboard
  exact_commands:
  - grep -n 'publishPercentiles(0.95)' account-service/src/main/java/com/piggymetrics/account/service/SettlementObservability.java
