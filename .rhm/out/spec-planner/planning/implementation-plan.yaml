  change: |
    Write account-service/pom.xml to the pinned final text. It adds spring-boot-starter-validation with no version element, directly after spring-boot-starter-web. It removes the version element on de.flapdoodle.embed.mongo so the Boot 2.3.12 parent manages 2.2.0. Every other dependency and the jacoco plugin stay.
  do_not:
  - Change account-service Java sources
  - Change spring-cloud-starter-oauth2, openfeign, eureka, hystrix, or config artifactIds
  - Keep version 1.50.3 on de.flapdoodle.embed.mongo
  compatibility: |
    HTTP paths and Feign client interfaces in account-service stay byte-identical.
  error_handling: |
    If the validation artifact fails to resolve from the parent BOM, stop.
  tests:
  - mvn -B -pl account-service -am test
  acceptance:
  - account-service/pom.xml contains spring-boot-starter-validation
  - account-service/pom.xml has no 1.50.3 version on embed mongo
  - mvn -B -pl account-service -am test exits 0
  rollback: |
    git checkout -- account-service/pom.xml
  why: |
    Boot 2.3 no longer brings javax.validation transitively from spring-boot-starter-web, and embed mongo 1.50.3 overrides the parent-managed 2.2.0 client used by Boot 2.3 tests.
  expected_result: |
    account-service compiles and its tests pass on the new parent.
  exact_commands:
  - mvn -B -pl account-service -am test
  edge_cases:
  - Embedded Mongo download is blocked by the network.
  invariants:
  - ArtifactId account-service and parent version 1.0-SNAPSHOT stay.
  - finalName account-service stays.
  machine_verify:
  - mvn -B -pl account-service -am test
  human_verify:
  - The validation dependency is present and the embed mongo version line is absent.
  input_contract: |
    STEP-001 root pom is saved.
  output_contract: |
    account-service/pom.xml matches the exact_snippet.
  companion_required: false
  creates_file: false
