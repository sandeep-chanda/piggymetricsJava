  - curl -fsS http://127.0.0.1:8761/ prints a page containing Eureka.
  - curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/ prints 200.
  input_contract: |
    STEP-002, STEP-003, STEP-006, and STEP-007 are saved.
  output_contract: |
