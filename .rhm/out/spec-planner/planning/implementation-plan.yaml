  - Edit .travis.yml
  - Edit docker-compose.yml or docker-compose.dev.yml
  - Run docker-compose -f docker-compose.yml up in the same session as the dev overlay
  - Change gateway route paths
  compatibility: |
    Production compose file stays valid. Dev overlay builds local modules.
  error_handling: |
    If mvn -B test fails, stop and fix the failing module. Do not skip tests to go green.
  tests:
  - mvn -B test
  - docker-compose -f docker-compose.yml config
  - curl -fsS http://127.0.0.1:8888/actuator/health
  acceptance:
  - mvn -B test exits 0
  - git diff --exit-code -- .travis.yml exits 0
  - config health URL returns a body that contains UP
  - http://127.0.0.1:8761/ returns a body that contains Eureka
  rollback: |
    docker-compose -f docker-compose.yml -f docker-compose.dev.yml down
  why: |
    P3.T1 requires the dev and deployment Compose definitions plus the existing Travis workflow, and the spec requires Maven verification from the root pom.
  expected_result: |
    The reactor tests pass and the locally built stack answers on config, Eureka, and the gateway.
  exact_commands:
  - mvn -B test
  - git diff --exit-code -- .travis.yml
  - git diff --exit-code -- docker-compose.yml docker-compose.dev.yml
  - git diff --exit-code -- config/src/main/resources/shared/gateway.yml
  - mvn -B package -DskipTests
  - docker-compose -f docker-compose.yml config
  - docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
  - curl -fsS http://127.0.0.1:8888/actuator/health
  - curl -fsS http://127.0.0.1:8761/
  - curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/
  edge_cases:
