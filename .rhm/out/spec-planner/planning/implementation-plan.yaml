  exact_snippet: "package com.piggymetrics.account.config;\n\nimport feign.RequestInterceptor;\nimport feign.RequestTemplate;\n\
    import org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport\
    \ org.springframework.security.config.Customizer;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\n\
    import org.springframework.security.oauth2.client.OAuth2AuthorizeRequest;\nimport org.springframework.security.oauth2.client.OAuth2AuthorizedClientManager;\n\
    import org.springframework.security.oauth2.client.registration.ClientRegistrationRepository;\nimport org.springframework.security.oauth2.client.web.DefaultOAuth2AuthorizedClientManager;\n\
    import org.springframework.security.oauth2.client.web.OAuth2AuthorizedClientRepository;\nimport org.springframework.security.web.SecurityFilterChain;\n\
    \n@Configuration\npublic class ResourceServerConfig {\n\n        @Bean\n        SecurityFilterChain securityFilterChain(HttpSecurity\
    \ http) throws Exception {\n                http.authorizeHttpRequests(auth -> auth\n                                .requestMatchers(\"\
    /\", \"/demo\").permitAll()\n                                .anyRequest().authenticated())\n                        \
    \        .oauth2ResourceServer(oauth2 -> oauth2.opaqueToken(Customizer.withDefaults()));\n                return http.build();\n\
    \        }\n\n        @Bean\n        OAuth2AuthorizedClientManager authorizedClientManager(\n                        ClientRegistrationRepository\
    \ clients,\n                        OAuth2AuthorizedClientRepository authorizedClients) {\n                return new\
    \ DefaultOAuth2AuthorizedClientManager(clients, authorizedClients);\n        }\n\n        @Bean\n        RequestInterceptor\
    \ oauth2FeignRequestInterceptor(OAuth2AuthorizedClientManager manager) {\n                return new RequestInterceptor()\
    \ {\n                        @Override\n                        public void apply(RequestTemplate template) {\n      \
    \                          OAuth2AuthorizeRequest request = OAuth2AuthorizeRequest\n                                 \
    \               .withClientRegistrationId(\"account-service\")\n                                                .principal(\"\
    account-service\")\n                                                .build();\n                                var client\
    \ = manager.authorize(request);\n                                if (client != null && client.getAccessToken() != null)\
    \ {\n                                        template.header(\"Authorization\", \"Bearer \" + client.getAccessToken().getTokenValue());\n\
    \                                }\n                        }\n                };\n        }\n}\n"
