  - D-002
  evidence_refs:
  - R-001
  companion_required: false
  compatibility: Maven reactor modules remain packaging jar under com.piggymetrics parent
  error_handling: Fail the step acceptance command on nonzero Maven exit; do not skip tests
  invariants:
  - Module artifactId and finalName stay unchanged
  - No production business endpoint paths change
  edge_cases:
  - BOM-managed versions stay unpinned in module POM dependency entries
  human_verify:
  - Open the touched file and confirm the pinned final text is present verbatim
  tests:
