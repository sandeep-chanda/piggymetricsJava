task_id: walk-17-oct
summary: In-place modernization of piggymetricsJava to Spring Boot 2.3.12.RELEASE and Spring Cloud Hoxton.SR12 on Java 1.8,
  keeping Eureka, Feign, Zuul, Spring Security OAuth, Hystrix, Config, and Turbine.
steps:
- id: STEP-000
  title: Create branch walk-17-oct-modernization from master
  depends_on: []
  requirement_refs:
  - REQ-008
  decision_refs:
  - D-001
  evidence_refs:
  - R-001
  files:
  - .git
  exact_files:
  - .git
  exact_branch: walk-17-oct-modernization
  existing_implementation: |
    origin/HEAD is master (git remote show origin).
  line_anchor: |
    repository default branch master
  change: |
    Cut branch walk-17-oct-modernization from master before any manifest edit. All later commits land on that branch. The harness opens one pull request from that branch back to master after P1, P2, and P3.
  do_not:
  - Commit modernization edits on master
  - Commit modernization edits on rhm/pack/spec-planner/5d2e414d
  - Open more than one pull request
  compatibility: |
    Branch name is walk-17-oct-modernization.
  error_handling: |
    If the branch name already exists, stop and report the existing ref. Do not pick a second name.
  tests:
  - git rev-parse --abbrev-ref HEAD prints walk-17-oct-modernization
  acceptance:
  - HEAD is walk-17-oct-modernization
  - The branch point is the current master commit
  rollback: |
    git checkout master && git branch -D walk-17-oct-modernization
  why: |
    Solo Delivery requires one branch cut from the default branch master.
  expected_result: |
    The working branch is walk-17-oct-modernization.
  exact_commands:
  - git checkout master
  - git checkout -b walk-17-oct-modernization
  edge_cases:
  - The branch name is already present on origin.
  invariants:
  - Default branch remains master.
  machine_verify:
  - git rev-parse --abbrev-ref HEAD
  human_verify:
  - The status line shows branch walk-17-oct-modernization.
  input_contract: |
    Clean checkout of master.
  output_contract: |
    Branch walk-17-oct-modernization checked out.
  companion_required: false
  creates_file: false
