  id: STEP-001
  title: P1.T1 Set parent Spring Boot 3.5.16 Spring Cloud 2025.0.3 Java 21
  exact_files:
  - pom.xml
  existing_implementation: pom.xml:1-67 parent spring-boot-starter-parent 2.0.3.RELEASE java.version 1.8 spring-cloud.version
    Finchley.RELEASE
  line_anchor: pom.xml:L11-L28
  before_snippet: "<parent>\n\t\t<groupId>org.springframework.boot</groupId>\n\t\t<artifactId>spring-boot-starter-parent</artifactId>\n\
    \t\t<version>2.0.3.RELEASE</version>\n\t\t<relativePath/>\n\t</parent>"
  change: Write the root reactor POM so spring-boot-starter-parent is 3.5.16, spring-cloud.version is 2025.0.3, and java.version
    is 21, keeping all nine modules listed for the P1 platform line including turbine-stream-service.
  do_not:
  - Change module business Java sources in this step
  - Lower java.version below 21
  - Keep spring-boot-starter-parent at 2.0.3.RELEASE
  - Ban edits to module Dockerfiles in later steps that raise the JVM image
  exact_snippet: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n                 xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n        <modelVersion>4.0.0</modelVersion>\n\n        <groupId>com.piggymetrics</groupId>\n        <artifactId>piggymetrics</artifactId>\n\
    \        <version>1.0-SNAPSHOT</version>\n        <packaging>pom</packaging>\n        <name>piggymetrics</name>\n\n  \
    \      <parent>\n                <groupId>org.springframework.boot</groupId>\n                <artifactId>spring-boot-starter-parent</artifactId>\n\
    \                <version>3.5.16</version>\n                <relativePath/>\n        </parent>\n\n        <properties>\n\
    \                <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n                <spring-cloud.version>2025.0.3</spring-cloud.version>\n\
    \                <java.version>21</java.version>\n        </properties>\n\n        <dependencyManagement>\n          \
    \      <dependencies>\n                        <dependency>\n                                <groupId>org.springframework.cloud</groupId>\n\
    \                                <artifactId>spring-cloud-dependencies</artifactId>\n                                <version>${spring-cloud.version}</version>\n\
    \                                <type>pom</type>\n                                <scope>import</scope>\n           \
    \             </dependency>\n                </dependencies>\n        </dependencyManagement>\n        \n        <modules>\n\
    \                <module>config</module>\n                <module>monitoring</module>\n                <module>registry</module>\n\
    \                <module>gateway</module>\n                <module>auth-service</module>\n                <module>account-service</module>\n\
    \                <module>statistics-service</module>\n                <module>notification-service</module>\n        \
    \        <module>turbine-stream-service</module>\n        </modules>\n\n</project>\n"
  exact_commands:
  - mvn -q -N help:evaluate -Dexpression=project.parent.version -DforceStdout
  acceptance:
  - pom.xml parent version equals 3.5.16
  - pom.xml properties java.version equals 21
  - pom.xml properties spring-cloud.version equals 2025.0.3
  rollback: git checkout -- pom.xml
  why: P1 Done-when requires every module to build on the new Boot 3 / Cloud 2025 / Java 21 line.
  expected_result: Root POM declares Boot 3.5.16, Cloud 2025.0.3, and Java 21 for the reactor.
  machine_verify:
  - grep -q '3.5.16' pom.xml
  - grep -q '2025.0.3' pom.xml
  - grep -q '<java.version>21</java.version>' pom.xml
  files:
  - pom.xml
