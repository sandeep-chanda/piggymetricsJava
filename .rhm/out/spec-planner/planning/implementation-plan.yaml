  exact_snippet: "package com.piggymetrics.account.client;\n\nimport com.piggymetrics.account.domain.Account;\n\
    import com.piggymetrics.account.service.SettlementObservability;\nimport org.slf4j.Logger;\nimport\
    \ org.slf4j.LoggerFactory;\nimport org.springframework.beans.factory.annotation.Autowired;\nimport\
    \ org.springframework.stereotype.Component;\n\n/**\n * @author cdov\n */\n@Component\npublic class\
    \ StatisticsServiceClientFallback implements StatisticsServiceClient {\n\tprivate static final Logger\
    \ LOGGER = LoggerFactory.getLogger(StatisticsServiceClientFallback.class);\n\n\t@Autowired\n\tprivate\
    \ SettlementObservability settlementObservability;\n\n\t@Override\n\tpublic void updateStatistics(String\
    \ accountName, Account account) {\n\t\tLOGGER.error(\"Error during update statistics for account:\
    \ {}\", accountName);\n\t\tsettlementObservability.markAttemptFailed();\n\t}\n}\n\n---\npackage com.piggymetrics.account.service;\n\
    \nimport com.piggymetrics.account.client.AuthServiceClient;\nimport com.piggymetrics.account.client.StatisticsServiceClient;\n\
    import com.piggymetrics.account.config.SettlementProperties;\nimport com.piggymetrics.account.domain.Account;\n\
    import com.piggymetrics.account.domain.Currency;\nimport com.piggymetrics.account.domain.Saving;\n\
    import com.piggymetrics.account.domain.SettlementDashboard;\nimport com.piggymetrics.account.domain.User;\n\
    import com.piggymetrics.account.repository.AccountRepository;\nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\n\
    import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\n\
    import org.springframework.util.Assert;\n\nimport java.math.BigDecimal;\nimport java.util.Date;\n\n\
    @Service\npublic class AccountServiceImpl implements AccountService {\n\n\tprivate final Logger log\
    \ = LoggerFactory.getLogger(getClass());\n\n\t@Autowired\n\tprivate StatisticsServiceClient statisticsClient;\n\
    \n\t@Autowired\n\tprivate AuthServiceClient authClient;\n\n\t@Autowired\n\tprivate AccountRepository\
    \ repository;\n\n\t@Autowired\n\tprivate SettlementObservability settlementObservability;\n\n\t@Autowired\n\
    \tprivate SettlementProperties settlementProperties;\n\n\t/**\n\t * {@inheritDoc}\n\t */\n\t@Override\n\
    \tpublic Account findByName(String accountName) {\n\t\tAssert.hasLength(accountName);\n\t\treturn\
    \ repository.findByName(accountName);\n\t}\n\n\t/**\n\t * {@inheritDoc}\n\t * Auth failures from POST\
    \ /uaa/users propagate to the caller (no Feign fallback).\n\t */\n\t@Override\n\tpublic Account create(User\
    \ user) {\n\n\t\tAccount existing = repository.findByName(user.getUsername());\n\t\tAssert.isNull(existing,\
    \ \"account already exists: \" + user.getUsername());\n\n\t\tauthClient.createUser(user);\n\n\t\t\
    Saving saving = new Saving();\n\t\tsaving.setAmount(new BigDecimal(0));\n\t\tsaving.setCurrency(Currency.getDefault());\n\
    \t\tsaving.setInterest(new BigDecimal(0));\n\t\tsaving.setDeposit(false);\n\t\tsaving.setCapitalization(false);\n\
    \n\t\tAccount account = new Account();\n\t\taccount.setName(user.getUsername());\n\t\taccount.setLastSeen(new\
    \ Date());\n\t\taccount.setSaving(saving);\n\t\taccount.setFailedBatchCount(0L);\n\n\t\trepository.save(account);\n\
    \n\t\tlog.info(\"new account has been created: \" + account.getName());\n\n\t\treturn account;\n\t\
    }\n\n\t/**\n\t * {@inheritDoc}\n\t */\n\t@Override\n\tpublic void saveChanges(String name, Account\
    \ update) {\n\n\t\tAccount account = repository.findByName(name);\n\t\tAssert.notNull(account, \"\
    can't find account with name \" + name);\n\n\t\taccount.setIncomes(update.getIncomes());\n\t\taccount.setExpenses(update.getExpenses());\n\
    \t\taccount.setSaving(update.getSaving());\n\t\taccount.setNote(update.getNote());\n\t\taccount.setLastSeen(new\
    \ Date());\n\n\t\tlong started = System.nanoTime();\n\t\tint maxAttempts = settlementProperties.getRetry().getMaxAttempts();\n\
    \t\tlong backoffMs = settlementProperties.getRetry().getBackoffMs();\n\t\tboolean settled = false;\n\
    \t\tfor (int attempt = 1; attempt <= maxAttempts; attempt++) {\n\t\t\tstatisticsClient.updateStatistics(name,\
    \ account);\n\t\t\tif (!settlementObservability.consumeFailedFlag()) {\n\t\t\t\tsettled = true;\n\t\
    \t\t\tbreak;\n\t\t\t}\n\t\t\tif (attempt < maxAttempts && backoffMs > 0L) {\n\t\t\t\ttry {\n\t\t\t\
    \t\tThread.sleep(backoffMs);\n\t\t\t\t} catch (InterruptedException ie) {\n\t\t\t\t\tThread.currentThread().interrupt();\n\
    \t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tlong elapsed = System.nanoTime() - started;\n\t\t\
    settlementObservability.recordLatencyNanos(elapsed);\n\t\taccount.setLastSettlementLatencyMs(elapsed\
    \ / 1_000_000L);\n\t\tif (!settled) {\n\t\t\taccount.setFailedBatchCount(account.getFailedBatchCount()\
    \ + 1L);\n\t\t}\n\n\t\trepository.save(account);\n\n\t\tlog.debug(\"account {} changes has been saved\"\
    , name);\n\t}\n\n\t/**\n\t * {@inheritDoc}\n\t */\n\t@Override\n\tpublic SettlementDashboard getSettlementDashboard()\
    \ {\n\t\treturn settlementObservability.snapshot();\n\t}\n}\n"
