  exact_snippet: "package com.piggymetrics.auth.config;\n\nimport java.util.UUID;\nimport com.nimbusds.jose.jwk.JWKSet;\n\
    import com.nimbusds.jose.jwk.RSAKey;\nimport com.nimbusds.jose.jwk.source.ImmutableJWKSet;\nimport com.nimbusds.jose.jwk.source.JWKSource;\n\
    import com.nimbusds.jose.proc.SecurityContext;\nimport java.security.KeyPair;\nimport java.security.KeyPairGenerator;\n\
    import java.security.interfaces.RSAPrivateKey;\nimport java.security.interfaces.RSAPublicKey;\nimport org.springframework.core.env.Environment;\n\
    import org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport\
    \ org.springframework.security.oauth2.core.AuthorizationGrantType;\nimport org.springframework.security.oauth2.core.ClientAuthenticationMethod;\n\
    import org.springframework.security.oauth2.server.authorization.client.InMemoryRegisteredClientRepository;\nimport org.springframework.security.oauth2.server.authorization.client.RegisteredClient;\n\
    import org.springframework.security.oauth2.server.authorization.client.RegisteredClientRepository;\nimport org.springframework.security.oauth2.server.authorization.settings.AuthorizationServerSettings;\n\
    import org.springframework.security.oauth2.server.authorization.settings.ClientSettings;\n\n@Configuration\npublic class\
    \ OAuth2AuthorizationConfig {\n\n        private final Environment env;\n\n        public OAuth2AuthorizationConfig(Environment\
    \ env) {\n                this.env = env;\n        }\n\n        @Bean\n        RegisteredClientRepository registeredClientRepository()\
    \ {\n                RegisteredClient browser = RegisteredClient.withId(UUID.randomUUID().toString())\n              \
    \                  .clientId(\"browser\")\n                                .clientAuthenticationMethod(ClientAuthenticationMethod.NONE)\n\
    \                                .authorizationGrantType(AuthorizationGrantType.AUTHORIZATION_CODE)\n                \
    \                .authorizationGrantType(AuthorizationGrantType.REFRESH_TOKEN)\n                                .redirectUri(\"\
    http://localhost:4000/login/oauth2/code/browser\")\n                                .scope(\"ui\")\n                 \
    \               .clientSettings(ClientSettings.builder().requireAuthorizationConsent(false).build())\n               \
    \                 .build();\n                RegisteredClient account = serviceClient(\"account-service\", env.getProperty(\"\
    ACCOUNT_SERVICE_PASSWORD\"));\n                RegisteredClient statistics = serviceClient(\"statistics-service\", env.getProperty(\"\
    STATISTICS_SERVICE_PASSWORD\"));\n                RegisteredClient notification = serviceClient(\"notification-service\"\
    , env.getProperty(\"NOTIFICATION_SERVICE_PASSWORD\"));\n                return new InMemoryRegisteredClientRepository(browser,\
    \ account, statistics, notification);\n        }\n\n        private static RegisteredClient serviceClient(String clientId,\
    \ String secret) {\n                return RegisteredClient.withId(UUID.randomUUID().toString())\n                   \
    \             .clientId(clientId)\n                                .clientSecret(\"{noop}\" + secret)\n              \
    \                  .clientAuthenticationMethod(ClientAuthenticationMethod.CLIENT_SECRET_BASIC)\n                     \
    \           .authorizationGrantType(AuthorizationGrantType.CLIENT_CREDENTIALS)\n                                .authorizationGrantType(AuthorizationGrantType.REFRESH_TOKEN)\n\
    \                                .scope(\"server\")\n                                .build();\n        }\n\n        @Bean\n\
    \        JWKSource<SecurityContext> jwkSource() throws Exception {\n                KeyPairGenerator generator = KeyPairGenerator.getInstance(\"\
    RSA\");\n                generator.initialize(2048);\n                KeyPair keyPair = generator.generateKeyPair();\n\
    \                RSAKey rsaKey = new RSAKey.Builder((RSAPublicKey) keyPair.getPublic())\n                            \
    \    .privateKey((RSAPrivateKey) keyPair.getPrivate())\n                                .keyID(UUID.randomUUID().toString())\n\
    \                                .build();\n                return new ImmutableJWKSet<>(new JWKSet(rsaKey));\n      \
    \  }\n\n        @Bean\n        AuthorizationServerSettings authorizationServerSettings() {\n                return AuthorizationServerSettings.builder().issuer(\"\
    http://auth-service:5000/uaa\").build();\n        }\n}\n"
