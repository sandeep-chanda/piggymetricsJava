  change: |
    Write pom.xml to the pinned final text. The parent version is 2.3.12.RELEASE. The property spring-cloud.version is Hoxton.SR12. The property java.version stays 1.8. Module order and artifact coordinates stay as they are.
  do_not:
  - Set java.version to 11 or 17
  - Import a Spring Cloud release train newer than Hoxton.SR12
  - Add a new Maven module
  - Remove a module from the reactor
  compatibility: |
    Java 1.8 remains the compiler release so .travis.yml jdk oraclejdk8 and the java:8-jre Dockerfiles stay valid.
  error_handling: |
    If Maven cannot resolve Hoxton.SR12, stop. Do not fall forward to 2020.0.0.
  tests:
  - mvn -B -N help:evaluate -Dexpression=spring-cloud.version -q -DforceStdout
  acceptance:
  - pom.xml parent version is 2.3.12.RELEASE
  - spring-cloud.version is Hoxton.SR12
  - java.version is 1.8
  - The nine module elements are unchanged
  rollback: |
    git checkout -- pom.xml
  why: |
    Hoxton.SR12 is the last Spring Cloud train whose BOM still manages Zuul, Hystrix, Turbine, Eureka, OpenFeign, Config, and spring-cloud-starter-oauth2, and its supported Boot line is 2.3.12.RELEASE.
  expected_result: |
    The reactor parent is Spring Boot 2.3.12.RELEASE with Spring Cloud Hoxton.SR12 and Java 1.8.
  exact_commands:
  - mvn -B -N help:evaluate -Dexpression=project.parent.version -q -DforceStdout
  - mvn -B -N help:evaluate -Dexpression=spring-cloud.version -q -DforceStdout
  - mvn -B -N help:evaluate -Dexpression=java.version -q -DforceStdout
  edge_cases:
  - A mirror that does not carry Hoxton.SR12.
  invariants:
  - GroupId com.piggymetrics and artifactId piggymetrics and version 1.0-SNAPSHOT stay.
  - java.version stays 1.8.
  machine_verify:
  - mvn -B -N help:evaluate -Dexpression=spring-cloud.version -q -DforceStdout
  human_verify:
  - pom.xml shows 2.3.12.RELEASE and Hoxton.SR12 on the parent and property lines.
  input_contract: |
    STEP-000 branch is checked out.
  output_contract: |
    Root pom.xml matches the exact_snippet bytes.
  companion_required: false
  creates_file: false
