    - curl -fsS http://127.0.0.1:8761/ prints a page containing Eureka.
  acceptance:
  - mvn -B test exits 0
  - git diff --exit-code -- .travis.yml exits 0
  - config health URL returns a body that contains UP
  no_imagination: true
