  critical_path: true
  exact_files:
  - config/Dockerfile
  summary_spec: mvn -B test from the repository root exits 0. .travis.yml, both Compose files, and gateway.yml are byte-identical
    to master. The dev overlay is up and config health, Eureka, and the gateway answer on ports 8888, 8761, and 80.
  verification:
    machine:
    - mvn -B test
    - docker-compose -f docker-compose.yml config
