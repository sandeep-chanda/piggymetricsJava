  critical_path: true
  exact_files:
  - pom.xml
  summary_spec: pom.xml parent is spring-boot-starter-parent 2.3.12.RELEASE, spring-cloud.version is Hoxton.SR12, and java.version
    is 1.8. The nine modules are unchanged.
  verification:
    machine:
    - mvn -B -N help:evaluate -Dexpression=spring-cloud.version -q -DforceStdout
    human:
    - pom.xml shows 2.3.12.RELEASE and Hoxton.SR12.
  acceptance:
  - pom.xml parent version is 2.3.12.RELEASE
  - spring-cloud.version is Hoxton.SR12
  - java.version is 1.8
