  - .git
  summary_spec: HEAD is branch walk-17-oct-modernization, created from master, and no manifest file has been edited yet.
  verification:
    machine:
    - git rev-parse --abbrev-ref HEAD
    human:
    - The status line shows branch walk-17-oct-modernization.
  acceptance:
  - HEAD is walk-17-oct-modernization
  - The branch point is the current master commit
  no_imagination: true
- id: STEP-001
