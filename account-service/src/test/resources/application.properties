spring.cloud.config.import-check.enabled=false
spring.cloud.config.enabled=false
spring.mongodb.embedded.version=3.6.5
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.autoconfigure.exclude=org.springframework.cloud.commons.security.ResourceServerTokenRelayAutoConfiguration,org.springframework.cloud.security.oauth2.client.ResourceServerTokenRelayAutoConfiguration
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
