spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    bus:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  config:
    import: "optional:configserver:"
  autoconfigure:
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/piggymetrics-account-test
  security:
    oauth2:
      client:
        registration:
          account-service:
            client-id: account-service
            client-secret: password
            authorization-grant-type: client_credentials
            scope: server
            provider: auth-service
        provider:
          auth-service:
            token-uri: http://localhost:9999/uaa/oauth2/token
      resourceserver:
        opaque-token:
          introspection-uri: http://localhost:9999/uaa/oauth2/introspect
          client-id: account-service
          client-secret: password

eureka:
  client:
    enabled: false

