spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    bus:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  config:
    import: "optional:configserver:"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/piggymetrics-test
  security:
    oauth2:
      client:
        registration:
          account-service:
            client-id: account-service
            client-secret: password
            authorization-grant-type: client_credentials
            scope: server
        provider:
          account-service:
            token-uri: http://localhost:9999/uaa/oauth2/token
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/uaa/oauth2/jwks

eureka:
  client:
    enabled: false
