spring:
  autoconfigure:
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  config:
    import: "optional:configserver:"
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/piggymetrics-auth-test

eureka:
  client:
    enabled: false

ACCOUNT_SERVICE_PASSWORD: account-pass
STATISTICS_SERVICE_PASSWORD: statistics-pass
NOTIFICATION_SERVICE_PASSWORD: notification-pass

